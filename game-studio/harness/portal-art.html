<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face{font-family:'Fredoka';font-weight:600 700;src:url('../public/fonts/Fredoka-Bold.ttf') format('truetype')}
      body{margin:0;background:#000}
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      // Portal thumbnails, used by scripts/portal-assets.mjs. Renders the game's own cover art
      // (the same cover() that makes public/covers and public/og) at the exact target size, so
      // nothing is stretched or upscaled:
      //   ?game=<slug>&w=512&h=384                      art only (512s and 200x120: no text)
      //   &zoom=1.2                                     crop in on the center (small sizes); < 1 zooms out
      //   &shift=0.1                                    move the art right (room for the title)
      //   &title=...&tagline=...                        1280 banners: title card in the og style
      // The art is drawn at 2x and scaled down for clean edges.
      const q = new URLSearchParams(location.search);
      const slug = q.get('game');
      const w = +q.get('w');
      const h = +q.get('h');
      const zoom = Math.min(2, Math.max(0.5, +q.get('zoom') || 1));
      // shift: move the art right by this fraction of the width (banners keep the title clear)
      const shift = Math.max(0, +q.get('shift') || 0);
      const title = q.get('title');
      const tagline = q.get('tagline');
      const FONT = '"Fredoka", "Segoe UI", system-ui, sans-serif';
      await document.fonts.load('700 40px Fredoka').catch(() => {});
      const [{ cover }, { default: meta }] = await Promise.all([import(`../src/games/${slug}/index.js`), import(`../src/games/${slug}/meta.js`)]);
      const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

      const SS = 2;
      // zoom < 1 renders a larger virtual frame and scales it down (smaller art, more room).
      const vw = zoom < 1 ? w / zoom : w;
      const vh = zoom < 1 ? h / zoom : h;
      const art = document.createElement('canvas');
      art.width = Math.round(vw * (1 + 2 * shift) * SS);
      art.height = Math.round(vh * SS);
      const ag = art.getContext('2d');
      ag.fillStyle = meta.bg || '#120b24';
      ag.fillRect(0, 0, art.width, art.height);
      cover(ag, art.width, art.height);

      const c = document.getElementById('c');
      c.width = w;
      c.height = h;
      const g = c.getContext('2d');
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      const sw = zoom > 1 ? (w * SS) / zoom : vw * SS;
      const sh = zoom > 1 ? (h * SS) / zoom : vh * SS;
      // Without shift this is a centered crop; with shift the left part of a wider render.
      const sx = shift ? 0 : (art.width - sw) / 2;
      g.drawImage(art, sx, (art.height - sh) / 2, sw, sh, 0, 0, w, h);

      if (title) {
        // Same recipe as the og cards: dark fade at the bottom, Fredoka title, mascot mark.
        const grad = g.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.42, 'rgba(11,6,24,0)');
        grad.addColorStop(1, 'rgba(11,6,24,0.92)');
        g.fillStyle = grad;
        g.fillRect(0, 0, w, h);
        const pad = Math.round(h * 0.085);
        const titleSize = Math.round(h * 0.15);
        const tagSize = Math.round(h * 0.058);
        g.shadowColor = 'rgba(0,0,0,0.5)';
        g.shadowBlur = Math.round(h * 0.025);
        g.textBaseline = 'alphabetic';
        g.fillStyle = '#fff';
        g.font = `700 ${titleSize}px ${FONT}`;
        const baseY = h - pad - (tagline ? tagSize * 1.55 : 0);
        g.fillText(title, pad, baseY, w - pad * 2);
        if (tagline) {
          g.font = `600 ${tagSize}px ${FONT}`;
          g.fillStyle = 'rgba(255,255,255,0.88)';
          g.fillText(tagline, pad + 2, h - pad, w - pad * 2);
        }
        g.shadowBlur = 0;
        const mascot = await loadImg('../public/brand/mascot-icon.png');
        if (mascot) {
          const s = Math.round(h * 0.1);
          g.save();
          g.shadowColor = 'rgba(0,0,0,0.45)';
          g.shadowBlur = s * 0.25;
          g.drawImage(mascot, w - pad - s, Math.round(pad * 0.75), s, s);
          g.restore();
        }
      }
      window.__done = true;
    </script>
  </body>
</html>
